name: Release

# Manual npm publish — trigger from the Actions tab (Release → Run workflow),
# pick a version bump, and it builds, tests, bumps, tags, publishes to npm, and
# cuts a GitHub Release. No local `npm publish` needed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit + tag, create the Release
      id-token: write # npm publish --provenance
    steps:
      # Releases must come from main — workflow_dispatch can be launched from any
      # branch in the Actions UI, and we must never publish non-main code to npm.
      - name: Guard — main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be run from 'main' (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (local commit + tag)
        id: version
        run: |
          npm version ${{ inputs.bump }} -m "chore(release): %s"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publish BEFORE pushing so a failed publish never leaves git ahead of npm
      # (no orphaned version-bump commit or tag on a publish failure).
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Push the release commit + tag together. If main advanced during the
      # build/publish window, the push is rejected; we rebase the (version-only)
      # release commit onto the new main, re-point the tag, and retry — so npm
      # (already published) and git never drift out of sync.
      - name: Push commit + tag (rebase-retry if main moved)
        run: |
          tag="v${{ steps.version.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:main" "refs/tags/$tag"; then
              echo "Pushed $tag on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main"
            git fetch origin main
            git tag -d "$tag"
            git rebase origin/main
            git tag -a "$tag" -m "$tag"
          done
          echo "::error::npm already published $tag but git push failed after retries. Reconcile main manually."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
