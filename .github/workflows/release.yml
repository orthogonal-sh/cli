name: Release

# Publishes @orth/cli to npm. Two triggers:
#   • push to main  — auto-release on every merge; the bump is inferred from the
#                     merged commits (breaking → major, feat → minor, else patch).
#   • workflow_dispatch — manual run from the Actions tab with an explicit bump.
# Builds, tests, bumps, tags, publishes, and cuts a GitHub Release. No local
# `npm publish` needed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't re-release the workflow's own version-bump commit. Pushes made with
    # GITHUB_TOKEN don't trigger new runs anyway, but this also guards manual/PAT
    # pushes of a "chore(release):" commit from looping.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write # push the version-bump commit + tag, create the Release
      id-token: write # npm publish --provenance
    steps:
      # Releases must come from main — workflow_dispatch can be launched from any
      # branch in the Actions UI, and we must never publish non-main code to npm.
      - name: Guard — main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be run from 'main' (got ${{ github.ref }})."
          exit 1

      # Mint a token for the orthogonal-release-bot GitHub App. That App is on
      # main's PR-bypass allowlist, so pushing the version-bump commit with this
      # token succeeds under branch protection (the default GITHUB_TOKEN can't
      # bypass and can't be added to the allowlist).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.name "orthogonal-release-bot[bot]"
          git config user.email "orthogonal-release-bot[bot]@users.noreply.github.com"

      # Manual runs use the chosen bump; auto (push) runs infer it from the
      # commits since the last tag: a "feat!:"/"BREAKING CHANGE" → major, a
      # "feat:" → minor, anything else → patch.
      # Manual runs always release with the chosen bump. Auto (push) runs infer
      # the bump from commits since the last tag — and SKIP entirely when there
      # are no such commits (e.g. a queued run whose changes a prior run already
      # released), so we never publish a duplicate/no-op version.
      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          # No prior release tag → can't scope "changes since last release", so
          # don't infer semver from the whole repo history; default to patch.
          if [ -z "$LAST_TAG" ]; then
            echo "No prior tag — defaulting to patch."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "type=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RANGE="$LAST_TAG..HEAD"
          if [ "$(git rev-list --count "$RANGE")" = "0" ]; then
            echo "No commits since $LAST_TAG — skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # feat/major intent lives in the SUBJECT line; only "BREAKING CHANGE"
          # is a footer/body marker. Check them from the right place so a body
          # line that merely mentions "feat:" can't force a minor bump.
          SUBJECTS="$(git log --format=%s "$RANGE")"
          BODIES="$(git log --format=%B "$RANGE")"
          if echo "$SUBJECTS" | grep -qE "^[a-z]+(\(.+\))?!:" \
            || echo "$BODIES" | grep -qE "^BREAKING CHANGE:"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$SUBJECTS" | grep -qE "^(feat|feature)(\(.+\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version (local commit + tag)
        id: version
        if: steps.bump.outputs.release == 'true'
        run: |
          npm version ${{ steps.bump.outputs.type }} -m "chore(release): %s"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Prove the exact release commit + tag can be pushed BEFORE the irreversible
      # npm publish — WITHOUT rebasing. A dry-run here fails on any blocker:
      # branch protection, missing perms, an existing remote tag, OR main having
      # moved (non-fast-forward). In every case we abort before publishing, so
      # nothing is stranded and the operator just re-runs. We deliberately do NOT
      # rebase: the published tarball must match the exact commit that gets tagged
      # (rebasing would move the tag/provenance onto a tree that was never built
      # or published — and never tested by this run).
      - name: Preflight — prove commit + tag are pushable (no rebase)
        if: steps.bump.outputs.release == 'true'
        run: |
          git push --dry-run origin \
            "HEAD:main" "refs/tags/v${{ steps.version.outputs.version }}"

      # Publish the exact tree the dry-run just proved pushable. Publishing before
      # the real push guarantees a failed publish never leaves git ahead of npm.
      - name: Publish to npm
        if: steps.bump.outputs.release == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Push the same commit + tag (single attempt — no rebase). The preflight
      # already proved this; only a race in the seconds since could fail it, and
      # even then we must NOT retarget the tag (it must keep matching the tarball).
      # On failure we error loudly: npm has the version, git just needs this exact
      # commit/tag pushed manually.
      - name: Push commit + tag
        if: steps.bump.outputs.release == 'true'
        run: |
          if ! git push origin \
            "HEAD:main" "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "::error::npm published v${{ steps.version.outputs.version }} but the git push failed (main likely moved since preflight). Push this exact commit + tag manually — do NOT rebase, so the tag keeps matching the published tarball."
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.bump.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
