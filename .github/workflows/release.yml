name: Release

# Publishes @orth/cli to npm. Two triggers:
#   • push to main  — auto-release on every merge; the bump is inferred from the
#                     merged commits (breaking → major, feat → minor, else patch).
#   • workflow_dispatch — manual run from the Actions tab with an explicit bump.
#
# Tag-driven: the version is derived from the latest git tag (the source of
# truth), set in the runner, published, and a new tag is pushed. It does NOT
# commit a version bump to main — main is a protected branch (PRs required), and
# only tag pushes are allowed there. No local `npm publish` needed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't re-release the workflow's own version-bump commit. Pushes made with
    # GITHUB_TOKEN don't trigger new runs anyway, but this also guards manual/PAT
    # pushes of a "chore(release):" commit from looping.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write # push the version-bump commit + tag, create the Release
      id-token: write # npm publish --provenance
    steps:
      # Releases must come from main — workflow_dispatch can be launched from any
      # branch in the Actions UI, and we must never publish non-main code to npm.
      - name: Guard — main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be run from 'main' (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Manual runs use the chosen bump; auto (push) runs infer it from the
      # commits since the last tag: a "feat!:"/"BREAKING CHANGE" → major, a
      # "feat:" → minor, anything else → patch.
      # Manual runs always release with the chosen bump. Auto (push) runs infer
      # the bump from commits since the last tag — and SKIP entirely when there
      # are no such commits (e.g. a queued run whose changes a prior run already
      # released), so we never publish a duplicate/no-op version.
      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          # No prior release tag → can't scope "changes since last release", so
          # don't infer semver from the whole repo history; default to patch.
          if [ -z "$LAST_TAG" ]; then
            echo "No prior tag — defaulting to patch."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "type=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RANGE="$LAST_TAG..HEAD"
          if [ "$(git rev-list --count "$RANGE")" = "0" ]; then
            echo "No commits since $LAST_TAG — skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # feat/major intent lives in the SUBJECT line; only "BREAKING CHANGE"
          # is a footer/body marker. Check them from the right place so a body
          # line that merely mentions "feat:" can't force a minor bump.
          SUBJECTS="$(git log --format=%s "$RANGE")"
          BODIES="$(git log --format=%B "$RANGE")"
          if echo "$SUBJECTS" | grep -qE "^[a-z]+(\(.+\))?!:" \
            || echo "$BODIES" | grep -qE "^BREAKING CHANGE:"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$SUBJECTS" | grep -qE "^(feat|feature)(\(.+\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # Compute the next version from the latest tag — tags are the source of
      # truth, NOT the committed package.json. main is a protected branch (PRs
      # required, admins enforced), so the release never pushes a commit to main;
      # deriving from tags removes any dependence on a committed version bump.
      - name: Compute next version from latest tag
        id: version
        if: steps.bump.outputs.release == 'true'
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          CUR="${LAST_TAG#v}"
          NEXT="$(node -e "const [a,b,c]=('$CUR').split('.').map(Number); const t='${{ steps.bump.outputs.type }}'; const v = t==='major'?[a+1,0,0] : t==='minor'?[a,b+1,0] : [a,b,c+1]; console.log(v.join('.'))")"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT (bump: ${{ steps.bump.outputs.type }}, from ${LAST_TAG})"

      - name: Guard — release tag must not already exist
        if: steps.bump.outputs.release == 'true'
        run: |
          if git ls-remote --tags --exit-code origin \
            "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.tag }} already exists on origin."
            exit 1
          fi

      # Set the version in the runner only — NOT committed (main is protected).
      - name: Set package version (in-runner, not committed)
        if: steps.bump.outputs.release == 'true'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # Tag-first, at the exact commit that was built and tested (HEAD): tag →
      # publish → (on publish failure) delete the tag. This keeps tagging and
      # publishing in the SAME run at the SAME commit, so the tag always points at
      # the published commit — no cross-run "recovery" that could tag a commit
      # (a moved HEAD) that never produced the tarball. Tags aren't PR-gated, so
      # this works under branch protection.
      - name: Tag the release commit
        if: steps.bump.outputs.release == 'true'
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Publish to npm
        if: steps.bump.outputs.release == 'true'
        run: |
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish failed — removing ${{ steps.version.outputs.tag }} so npm and git stay consistent."
            git push origin --delete "refs/tags/${{ steps.version.outputs.tag }}" \
              || echo "::warning::could not delete ${{ steps.version.outputs.tag }}; delete it manually before retrying."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.bump.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
